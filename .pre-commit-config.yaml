default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    entry: clang-format
    args: ["-style=file", "-i"]
    language: system
    files: \.[ch](pp)?$

  - id: additional-lint
    name: Run additional linters
    entry: tools/additional_lint
    language: python
    stages: [pre-commit]
    additional_dependencies:
      - pyjson5
      - jsonschema

  - id: additional-lint -a
    name: Run additional linters (repo-wide)
    entry: tools/additional_lint -a
    language: python
    stages: [pre-commit]
    pass_filenames: false
    additional_dependencies:
      - pyjson5
      - jsonschema

  - id: imports
    name: imports
    entry: tools/sort_imports
    language: system
    files: \.[ch](pp)?$

  - id: update-game-strings
    name: Update game strings to match source code
    entry: tools/update_game_strings
    language: python
    stages: [pre-commit]
    pass_filenames: false
    additional_dependencies:
      - pyjson5

  - id: update-lua-docs
    name: Regenerate Lua API docs from docs/trx/lua/api.json
    entry: tools/update_lua_docs
    language: python
    stages: [pre-commit]
    pass_filenames: false

- repo: https://github.com/JohnnyMorganz/StyLua
  rev: v2.3.0
  hooks:
    - id: stylua-github

- repo: local
  hooks:
  - id: commit-msg-50-72
    name: Commit message 50/72 rule
    entry: python3 tools/check_commit_msg
    language: system
    stages: [commit-msg]
