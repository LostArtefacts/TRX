name: Create a test build

permissions:
  contents: write

# Keep the trigger on `pull_request`, never `pull_request_target`. On a fork PR
# `pull_request` runs with a read-only token and withholds every repository
# secret, so the `secrets: inherit` below resolves to nothing an attacker can
# reach. Switching to `pull_request_target` would run this same untrusted code
# in the base-repo context with those secrets exposed, turning a hostile PR into
# a full secret leak.
on:
  pull_request:
  push:
    branches:
      - '!stable'
      - '!develop'

jobs:
  package_linux:
    name: Linux
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: debug
      zip: false
    secrets: inherit

  package_win:
    name: Windows
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: debug
      zip: false
    secrets: inherit

  package_win_te:
    name: Build Tomb Editor bundle
    needs:
      - package_win
    uses: ./.github/workflows/job_build_te.yml
    with:
      target: debug
      zip: false
      windows_artifact_name: ${{ needs.package_win.outputs.trx_asset }}
    secrets: inherit

