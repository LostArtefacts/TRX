name: Run code linters

on:
  - push
  - pull_request

jobs:
  lint:
    name: Run code linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -
          echo 'deb https://apt.llvm.org/noble llvm-toolchain-noble-21 main' | sudo tee -a /etc/apt/sources.list
          echo 'deb-src https://apt.llvm.org/noble llvm-toolchain-noble-21 main' | sudo tee -a /etc/apt/sources.list
          sudo apt update
          sudo apt-get install -y clang-format-21 python3-pip pipx
          sudo snap install --edge --classic just
          sudo ln -s /usr/bin/clang-format-21 /usr/local/bin/clang-format
          python3 -m pipx install prek
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo python3 -m pip install pyjson5

      - name: Check formatted code differences
        run: |
          set +e
          just lint-format
          lint_format_status=$?
          set -e
          if ! git diff --quiet; then
            echo 'Formatting diffs detected in:'
            git diff --exit-code || (
              clang-format --version
              echo 'Please run `just lint` and commit the changes.'
              exit 1
            )
          fi
          if [ "${lint_format_status}" -ne 0 ]; then
            clang-format --version
            echo 'just lint-format failed.'
            exit "${lint_format_status}"
          fi

      - name: Check imports
        run: |
          git add -A
          just lint-imports
          git diff --exit-code || (
            include-what-you-use --version
            echo 'Please run `just lint` and commit the changes.'
            exit 1
          )
