name: Post build links to pull request
on:
  workflow_run:
    workflows: ['Create a test build']
    types: [completed]

# This workflow runs in the privileged base-repo context with a read-write
# token, so it holds no more than it needs: it reads the run's artifacts and
# writes one PR comment. It never checks out or executes pull request code.
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  pr_comment:
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target')
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # This snippet is public-domain, combined from
          # https://github.com/oprypin/nightly.link/blob/master/.github/workflows/pr-comment.yml
          # https://github.com/AKSW/submission.d2r2.aksw.org/blob/main/.github/workflows/pr-comment.yml
          script: |
            // Function Definitions

            // A `pull_request_target` run has the default branch tip as its
            // head SHA, so the build names the pull request commit in its run
            // name instead.
            function builtSha() {
              const run = context.payload.workflow_run;
              if (run.event !== 'pull_request_target') {
                return run.head_sha;
              }
              const match = /^Test build of #\d+ at ([0-9a-f]{40})$/.exec(run.display_title);
              if (!match) {
                throw new NoMatchingPRError(`Unexpected run name: ${run.display_title}`);
              }
              return match[1];
            }

            class NoMatchingPRError extends Error {
              constructor(message) {
                super(message);
                this.name = "NoMatchingPRError";
              }
            }

            class NoArtifactsError extends Error {
              constructor(message) {
                super(message);
                this.name = "NoArtifactsError";
              }
            }

            /**
             * Fetch PR details for a given commit SHA.
             * @returns {Object} PR details containing prNumber, prRef, prRepoId.
             * @throws {Error} If no matching PR is found.
             */
            async function fetchPRDetails(sha) {
              const iterator = github.paginate.iterator(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for await (const { data } of iterator) {
                for (const pull of data) {
                  if (pull.head.sha === sha) {
                    return {
                      prNumber: pull.number,
                      prRef: pull.head.ref,
                      prRepoId: pull.head.repo.id
                    };
                  }
                }
              }
              throw new NoMatchingPRError("No matching PR found for the commit SHA");
            }

            /**
             * Fetch all artifacts for a given workflow run.
             * @returns {Object} All artifacts data.
             * @throws {Error} If no artifacts are found.
             */
            async function fetchAllArtifacts() {
              const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
              });
              if (!(artifactsResponse.data && artifactsResponse.data.artifacts && artifactsResponse.data.artifacts.length)) {
                throw new NoArtifactsError("No artifacts found for the workflow run");
              }
              return artifactsResponse.data.artifacts;
            }

            /**
             * Create or update a comment on the PR.
             * @param {number} prNumber - The PR number.
             * @param {string} purpose - The purpose of the comment.
             * @param {string} body - The comment body.
             * @throws {Error} If the comment creation or update fails.
             */
            async function upsertComment(prNumber, purpose, body) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              const marker = `<!-- bot: ${purpose} -->`;
              body = marker + "\n" + body;

              const existing = comments.filter(c => c.body.includes(marker));
              if (existing.length > 0) {
                const last = existing[existing.length - 1];
                core.info(`Updating comment ${last.id}`);
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body,
                  comment_id: last.id,
                });
              } else {
                core.info(`Creating a comment in PR #${prNumber}`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body,
                  issue_number: prNumber,
                });
              }
            }

            /**
             * Handle and log errors with detailed context and exit the process.
             * @param {Error} error - The error object.
             * @param {string} description - Description of the context where the error occurred.
             */
            function handleError(error, description, prNumber) {
              let exitCode = 1;
              let log = core.error;
              if (error instanceof NoMatchingPRError) {
                exitCode = 0;
                log = core.warning;
              }
              log(`Failed to ${description}`);
              log(`Message: ${error.message}`);
              log(`Stack Trace: ${error.stack || 'No stack trace available'}`);
              if (prNumber) {
                log(`PR Number: ${prNumber}`);
              }
              log(`PRs: https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/pulls`);
              log(`SHA: ${sha}`);
              process.exit(exitCode);
            }

            // Main Code Execution

            let sha, prNumber, prRef, prRepoId;

            // Fetch PR details
            try {
              sha = builtSha();
              ({ prNumber, prRef, prRepoId } = await fetchPRDetails(sha));
              core.info(`Found PR: #${prNumber}, Ref: ${prRef}, Repo ID: ${prRepoId}`);
            } catch (error) {
              handleError(error, 'fetch PR details', undefined);
            }

            // Fetch all artifacts
            let allArtifacts;
            try {
              allArtifacts = await fetchAllArtifacts();
              core.info(`Artifacts fetched successfully`);
            } catch (error) {
              // A `pull_request_target` run builds nothing when its gate
              // leaves the pull request to `pull_request`.
              if (error instanceof NoArtifactsError && context.payload.workflow_run.event === 'pull_request_target') {
                core.info('The run built nothing; no comment to post');
                return;
              }
              handleError(error, 'fetch artifacts', prNumber);
            }

            // Artifact names come from the pull request's own tree, so escape
            // them before they enter the comment. This keeps a crafted name from
            // injecting markdown or breaking out of the link label.
            function escapeLinkLabel(name) {
              return String(name).replace(/[\\\[\]`<>\r\n]/g, '');
            }

            // Construct the comment body
            let body = 'Download the built assets for this pull request:\n' +
              allArtifacts
                .filter(item => item.name !== "assets")
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(item => `* [${escapeLinkLabel(item.name)}.zip](https://nightly.link/${context.repo.owner}/${context.repo.repo}/actions/artifacts/${item.id}.zip)`)
                .join('\n');

            // Upsert the comment on the PR
            try {
              await upsertComment(prNumber, "nightly-link", body);
              core.info("Comment created/updated successfully");
            } catch (error) {
              handleError(error, 'create/update comment', prNumber);
            }
