name: Publish a new TR2X release

permissions:
  contents: write

on:
  push:
    branch: stable
    tags:
      - "tr2-*"

  workflow_dispatch:
    inputs:
      draft:
        description: "Draft"
        required: true
        type: boolean
        default: false
      prerelease:
        description: "Prerelease"
        required: true
        type: boolean
        default: false
      tag_name:
        description: "Tag name"
        required: false
        type: string
        default: github.ref_name

jobs:
  package_tr2_linux:
    name: Build TR2 (Linux)
    if: vars.RELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build_tr2.yml
    with:
      platform: linux
      target: release
    secrets: inherit

  package_tr2_win:
    name: Build TR2 (Windows)
    if: vars.RELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build_tr2.yml
    with:
      platform: win-all
      target: release
    secrets: inherit

  package_tr2_win_installer:
    name: Build TR2 (Windows installer)
    if: vars.RELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build_tr2.yml
    with:
      platform: win-installer
      target: release
    secrets: inherit

  package_mac:
    name: Build TR2 (Mac)
    if: |
      vars.RELEASE_ENABLE == 'true' &&
      vars.MACOS_ENABLE == 'true'
    uses: ./.github/workflows/job_build_tr2_macos.yml
    with:
      target: release
      let_mac_fail: ${{ inputs.let_mac_fail == true || inputs.let_mac_fail == 'true' }}
    secrets: inherit

  publish_release:
    if: always() && (vars.RELEASE_ENABLE == 'true')
    name: Create a GitHub release
    needs:
      - package_tr2_linux
      - package_tr2_win
      - package_tr2_win_installer
      - package_mac
    with:
      draft: ${{ inputs.draft || false }}
      prerelease: ${{ inputs.draft || false }}
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      changelog_game_version: 2
    uses: ./.github/workflows/job_release.yml
