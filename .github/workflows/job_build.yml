name: Build TRX and the installer

on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: "Platform to build for"
        required: true
      target:
        type: string
        description: "Target to build for"
        required: true
      zip:
        type: boolean
        description: "Pack the artifacts into zip"
        required: true
    outputs:
      trx_asset:
        description: "Uploaded artifact name"
        value: ${{ jobs.build.outputs.trx_asset }}

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    outputs:
      trx_asset: ${{ steps.vars.outputs.trx_asset }}

    steps:
      - name: Install dependencies
        uses: taiki-e/install-action@just

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: vars
        name: Prepare variables
        run: |
          echo "version=$(just output-current-version)" >> $GITHUB_OUTPUT
          echo "trx_dir=build/artifacts/trx/" >> $GITHUB_OUTPUT
          echo "trx_asset=$(just output-package-name --platform ${{ inputs.platform }})" >> $GITHUB_OUTPUT

      - name: Download large assets
        if: ${{ inputs.target == 'release' }}
        run: just download-assets

      # A pull request restores the shared ccache read-only and never writes it
      # back (see the Save step). This stops a malicious branch from poisoning
      # the compiler cache that a later develop or release build would consume.
      - name: Restore ccache
        id: ccache
        if: ${{ inputs.platform == 'linux' || inputs.platform == 'win' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/ccache
          key: ccache-v1-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/shared/docker/game-linux/Dockerfile', 'tools/shared/docker/game-win/Dockerfile', 'tools/shared/docker/game-win/meson_linux_mingw32.txt') }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.target }}-
            ccache-v1-${{ runner.os }}-${{ inputs.platform }}-

      - name: Package asset (${{ inputs.platform }})
        env:
          CCACHE_DIR: /app/.cache/ccache/${{ inputs.platform }}-${{ inputs.target }}
          CCACHE_BASEDIR: /app
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
        run: |
          mkdir -p ".cache/ccache/${{ inputs.platform }}-${{ inputs.target }}"
          if [ "${{ inputs.zip }}" = "1" ] || [ "${{ inputs.zip }}" = "true" ]; then
            just trx-package-${{ inputs.platform }} "${{ inputs.target }}" -o "${{ steps.vars.outputs.trx_dir }}"
          else
            just trx-package-${{ inputs.platform }} "${{ inputs.target }}" -o "${{ steps.vars.outputs.trx_dir }}" --no-zip
          fi

      # Only a push from a trusted branch writes the shared ccache. Pull requests
      # skip this step and stay restore-only.
      - name: Save ccache
        if: ${{ github.event_name != 'pull_request' && steps.ccache.outputs.cache-primary-key && (inputs.platform == 'linux' || inputs.platform == 'win') }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # The dump needs a binary to query, so it rides along with the Linux build
      # rather than paying for one of its own. The engine boots SDL before it
      # prints the API, hence the dummy video driver and libGL. Release builds
      # skip it: a stale dump is not a reason to stop a release.
      - name: Check the Lua API docs
        if: ${{ inputs.platform == 'linux' && inputs.target == 'debug' }}
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1
          just lua-api-check

      - name: Upload artifacts (combined)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.trx_asset }}
          path: ${{ steps.vars.outputs.trx_dir }}
          compression-level: 0
