# Meson cross-compilation file for Emscripten (WebGL/WASM build)
#
# Usage:
#   meson setup --cross-file tools/shared/emscripten/emscripten_cross.ini build/webgl src/
#   meson compile -C build/webgl TRX
#
# Prerequisites:
#   - Emscripten SDK (emsdk) installed and activated
#   - emcc, em++, emar, etc. available in PATH

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['-sUSE_SDL=2', '-sUSE_ZLIB=1', '-sFULL_ES3=1', '-DEMSCRIPTEN_BUILD', '-DGLEW_NO_GLU', '--use-port=contrib.lua']
c_link_args = ['-sUSE_SDL=2', '-sUSE_ZLIB=1', '-sFULL_ES3=1', '--use-port=contrib.lua']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true
