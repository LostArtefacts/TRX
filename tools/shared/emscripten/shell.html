<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>TRX - Tomb Raider Engine (WebGL)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100dvh; overflow: hidden; background: #000; }
        #canvas {
            display: block;
            width: 100dvw;
            height: 100dvh;
            cursor: default;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #c8a040;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 10;
        }
        #loading h1 { font-size: 2em; margin-bottom: 0.5em; }
        #progress-bar {
            width: 320px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin: 1em auto;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: #c8a040;
            transition: width 0.2s;
        }
        #status { font-size: 0.9em; color: #888; margin-top: 0.5em; }
        #start-gate {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: #000;
            cursor: pointer;
        }
        #start-gate p {
            color: #c8a040;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.4em;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .hidden { display: none !important; }

        /* Touch controls overlay */
        #touch-controls {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100dvw; height: 100dvh;
            z-index: 20;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            --main-size: clamp(64px, 11dvw, 96px);
            --orbit-size: clamp(34px, 6dvw, 52px);
            --base-right: 3dvw;
            --base-bottom: 5dvh;
            --action-right: calc(var(--base-right) + var(--main-size) * 0.86);
            --action-bottom: calc(var(--base-bottom) + var(--main-size) * 0.86);
            --jump-center-right: calc(var(--base-right) + (var(--main-size) / 2));
            --jump-center-bottom: calc(var(--base-bottom) + (var(--main-size) / 2));
            --action-center-right: calc(var(--action-right) + (var(--main-size) / 2));
            --action-center-bottom: calc(var(--action-bottom) + (var(--main-size) / 2));
            --grid-step-x: calc(var(--action-center-right) - var(--jump-center-right));
            --grid-step-y: calc(var(--action-center-bottom) - var(--jump-center-bottom));
        }
        .tc-btn {
            position: absolute;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.34);
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(18px, 4.5vmin, 30px);
            touch-action: none;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .tc-btn.active {
            background: rgba(0, 0, 0, 0.74);
            border-color: rgba(255, 255, 255, 0.72);
        }

        /* Diagonal-capable D-pad */
        .tc-dpad {
            position: absolute;
            left: 3dvw;
            bottom: 5dvh;
            width: clamp(108px, 22dvw, 170px);
            height: clamp(108px, 22dvw, 170px);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            background: radial-gradient(circle, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.58) 68%, rgba(0,0,0,0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.34);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .tc-dpad .tc-ring {
            position: absolute;
            inset: 18%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }
        .tc-dpad .tc-thumb {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34%;
            height: 34%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 40ms linear;
        }
        .tc-dpad .tc-dir {
            position: absolute;
            width: 30%;
            height: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.55);
            font-size: clamp(18px, 4.2vmin, 28px);
            transition: color 80ms ease;
            pointer-events: none;
        }
        .tc-dpad .tc-up { left: 35%; top: 3%; }
        .tc-dpad .tc-right { right: 3%; top: 35%; }
        .tc-dpad .tc-down { left: 35%; bottom: 3%; }
        .tc-dpad .tc-left { left: 3%; top: 35%; }
        .tc-dpad.tc-press-up .tc-up,
        .tc-dpad.tc-press-right .tc-right,
        .tc-dpad.tc-press-down .tc-down,
        .tc-dpad.tc-press-left .tc-left {
            color: rgba(255, 255, 255, 0.98);
        }

        /* Main action buttons */
        .tc-jump,
        .tc-action {
            width: var(--main-size);
            height: var(--main-size);
            font-size: clamp(28px, 5.4vmin, 42px);
            border-width: 2px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.35);
        }
        .tc-jump {
            right: var(--base-right);
            bottom: var(--base-bottom);
        }
        .tc-action {
            right: var(--action-right);
            bottom: var(--action-bottom);
        }

        /* Small orbiting buttons around action */
        .tc-orbit {
            width: var(--orbit-size);
            height: var(--orbit-size);
            font-size: clamp(18px, 3.4vmin, 26px);
        }
        /* 3x2 center-aligned grid with fixed Action (top-center) and Jump (bottom-right) */
        .tc-walk {
            right: calc(var(--action-center-right) + var(--grid-step-x) - (var(--orbit-size) / 2));
            bottom: calc(var(--action-center-bottom) - (var(--orbit-size) / 2));
        }
        .tc-roll {
            right: calc(var(--jump-center-right) - (var(--orbit-size) / 2));
            bottom: calc(var(--action-center-bottom) - (var(--orbit-size) / 2));
        }
        .tc-look {
            right: calc(var(--action-center-right) + var(--grid-step-x) - (var(--orbit-size) / 2));
            bottom: calc(var(--jump-center-bottom) - (var(--orbit-size) / 2));
        }
        .tc-guns {
            right: calc(var(--action-center-right) - (var(--orbit-size) / 2));
            bottom: calc(var(--jump-center-bottom) - (var(--orbit-size) / 2));
        }

        /* Top bar */
        .tc-menu,
        .tc-pause {
            top: 2dvh;
            width: clamp(32px, 5.4dvw, 46px);
            height: clamp(32px, 5.4dvw, 46px);
            font-size: clamp(13px, 2.5vmin, 19px);
        }
        .tc-menu { left: calc(50% - clamp(32px, 5.4dvw, 46px) - 7px); }
        .tc-pause { left: calc(50% + 8px); right: auto; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>TRX</h1>
        <p>Tomb Raider Engine &mdash; WebGL Build</p>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="status">Initializing...</p>
    </div>
    <div id="start-gate" class="hidden">
        <p>Press any key or button to continue</p>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="touch-controls">
        <!-- D-pad -->
        <div class="tc-dpad" id="tc-dpad">
            <div class="tc-ring"></div>
            <div class="tc-thumb" id="tc-dpad-thumb"></div>
            <div class="tc-dir tc-up"><i class="fa-solid fa-caret-up"></i></div>
            <div class="tc-dir tc-left"><i class="fa-solid fa-caret-left"></i></div>
            <div class="tc-dir tc-right"><i class="fa-solid fa-caret-right"></i></div>
            <div class="tc-dir tc-down"><i class="fa-solid fa-caret-down"></i></div>
        </div>
        <!-- Main + orbiting action buttons -->
        <div class="tc-btn tc-jump" data-keys="AltRight"><i class="fa-solid fa-up-long"></i></div>
        <div class="tc-btn tc-action" data-keys="ControlRight,Enter"><i class="fa-solid fa-hand-fist"></i></div>
        <div class="tc-btn tc-orbit tc-guns" data-keys="Space"><i class="fa-solid fa-gun"></i></div>
        <div class="tc-btn tc-orbit tc-roll" data-keys="End"><i class="fa-solid fa-rotate-right"></i></div>
        <div class="tc-btn tc-orbit tc-walk" data-keys="ShiftRight"><i class="fa-solid fa-person-walking"></i></div>
        <div class="tc-btn tc-orbit tc-look" data-keys="Numpad0"><i class="fa-solid fa-eye"></i></div>
        <!-- Top bar -->
        <div class="tc-btn tc-menu"  data-keys="Escape"><i class="fa-solid fa-bars"></i></div>
        <div class="tc-btn tc-pause" data-keys="KeyP"><i class="fa-solid fa-pause"></i></div>
    </div>

    <script>
        var _trxCacheBust = '';  // __CACHE_BUST__
        var Module = {
            locateFile: function(path) {
                return _trxCacheBust ? path + '?' + _trxCacheBust : path;
            },
            canvas: (function() { return document.getElementById('canvas'); })(),
            setStatus: function(text) {
                var status = document.getElementById('status');
                if (status) status.textContent = text;
                // Parse progress from Emscripten status messages
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var pct = (parseFloat(m[2]) / parseFloat(m[4])) * 100;
                    var fill = document.getElementById('progress-fill');
                    if (fill) fill.style.width = pct + '%';
                }
                if (text === '') {
                    document.getElementById('loading').classList.add('hidden');
                }
            },
            onRuntimeInitialized: function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('canvas').focus();
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left
                    ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
                    : 'Starting...');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown - see JavaScript console');
        };

        // Let F11 pass through to the browser for native fullscreen toggle.
        // SDL/Emscripten normally captures all key events and calls
        // preventDefault(), which blocks the browser's native F11 handling.
        // By intercepting in the capture phase and stopping propagation,
        // the browser handles F11 natively (where ESC does not exit
        // fullscreen, unlike the JavaScript Fullscreen API).
        document.addEventListener('keydown', function(e) {
            if (e.code === 'F11') {
                e.stopImmediatePropagation();
            }
        }, true);

        // Ensure canvas keeps focus during fullscreen transitions so SDL's
        // event handlers capture all keyboard input (including Escape).
        document.addEventListener('fullscreenchange', function() {
            document.getElementById('canvas').focus();
        });

        // --- Touch controls ---
        (function() {
            var canvas = document.getElementById('canvas');
            var overlay = document.getElementById('touch-controls');
            var buttons = overlay.querySelectorAll('.tc-btn');
            var dpad = document.getElementById('tc-dpad');
            var dpadThumb = document.getElementById('tc-dpad-thumb');

            // Map KeyboardEvent.code to a user-friendly key value for the
            // event's `key` property.  Emscripten's SDL2 primarily uses
            // `code`, but we set `key` for completeness.
            var codeToKey = {
                ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown',
                ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
                AltRight: 'Alt', ControlRight: 'Control',
                ShiftRight: 'Shift', Space: ' ', End: 'End',
                Numpad0: '0', Escape: 'Escape', KeyP: 'p',
                Enter: 'Enter'
            };

            function dispatchKey(code, type) {
                canvas.dispatchEvent(new KeyboardEvent(type, {
                    code: code,
                    key: codeToKey[code] || code,
                    bubbles: true,
                    cancelable: true
                }));
            }

            var dpadButtons = [ 'ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft' ];
            var dpadState = { ArrowUp: false, ArrowRight: false, ArrowDown: false, ArrowLeft: false };
            var dpadTouchId = null;
            var dpadThreshold = 0.38;

            function setDpadKey(code, pressed) {
                if (dpadState[code] === pressed) {
                    return;
                }
                dpadState[code] = pressed;
                dispatchKey(code, pressed ? 'keydown' : 'keyup');
            }

            function resetDpad() {
                dpadButtons.forEach(function(code) { setDpadKey(code, false); });
                dpad.classList.remove('tc-press-up', 'tc-press-right', 'tc-press-down', 'tc-press-left');
                dpadThumb.style.transform = 'translate(-50%, -50%)';
            }

            function updateDpadFromTouch(touch) {
                var rect = dpad.getBoundingClientRect();
                var cx = rect.left + rect.width * 0.5;
                var cy = rect.top + rect.height * 0.5;
                var dx = touch.clientX - cx;
                var dy = touch.clientY - cy;
                var radius = Math.min(rect.width, rect.height) * 0.5;
                var deadZone = radius * 0.2;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var nx = 0;
                var ny = 0;

                if (dist > 0) {
                    nx = dx / dist;
                    ny = dy / dist;
                }

                var thumbDist = Math.min(dist, radius * 0.68);
                dpadThumb.style.transform =
                    'translate(calc(-50% + ' + (nx * thumbDist).toFixed(2) + 'px), calc(-50% + '
                    + (ny * thumbDist).toFixed(2) + 'px))';

                var up = false;
                var right = false;
                var down = false;
                var left = false;

                if (dist >= deadZone) {
                    up = ny < -dpadThreshold;
                    right = nx > dpadThreshold;
                    down = ny > dpadThreshold;
                    left = nx < -dpadThreshold;
                }

                setDpadKey('ArrowUp', up);
                setDpadKey('ArrowRight', right);
                setDpadKey('ArrowDown', down);
                setDpadKey('ArrowLeft', left);

                dpad.classList.toggle('tc-press-up', up);
                dpad.classList.toggle('tc-press-right', right);
                dpad.classList.toggle('tc-press-down', down);
                dpad.classList.toggle('tc-press-left', left);
            }

            dpad.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (dpadTouchId !== null) {
                    return;
                }
                var t = e.changedTouches[0];
                dpadTouchId = t.identifier;
                updateDpadFromTouch(t);
                canvas.focus();
            }, { passive: false });

            dpad.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (dpadTouchId === null) {
                    return;
                }
                for (var i = 0; i < e.changedTouches.length; i++) {
                    var t = e.changedTouches[i];
                    if (t.identifier === dpadTouchId) {
                        updateDpadFromTouch(t);
                        break;
                    }
                }
            }, { passive: false });

            function maybeEndDpadTouch(e) {
                e.preventDefault();
                if (dpadTouchId === null) {
                    return;
                }
                for (var i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === dpadTouchId) {
                        dpadTouchId = null;
                        resetDpad();
                        break;
                    }
                }
            }

            dpad.addEventListener('touchend', maybeEndDpadTouch, { passive: false });
            dpad.addEventListener('touchcancel', maybeEndDpadTouch, { passive: false });

            buttons.forEach(function(btn) {
                if (btn.closest('.tc-dpad')) {
                    return;
                }
                var codes = btn.getAttribute('data-keys').split(',');
                var activeTouches = {};  // touchId → true

                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    var dominated = Object.keys(activeTouches).length === 0;
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        activeTouches[e.changedTouches[i].identifier] = true;
                    }
                    if (dominated) {
                        btn.classList.add('active');
                        codes.forEach(function(c) { dispatchKey(c, 'keydown'); });
                    }
                    canvas.focus();
                }, { passive: false });

                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        delete activeTouches[e.changedTouches[i].identifier];
                    }
                    if (Object.keys(activeTouches).length === 0) {
                        btn.classList.remove('active');
                        codes.forEach(function(c) { dispatchKey(c, 'keyup'); });
                    }
                }, { passive: false });

                btn.addEventListener('touchcancel', function(e) {
                    e.preventDefault();
                    for (var i = 0; i < e.changedTouches.length; i++) {
                        delete activeTouches[e.changedTouches[i].identifier];
                    }
                    if (Object.keys(activeTouches).length === 0) {
                        btn.classList.remove('active');
                        codes.forEach(function(c) { dispatchKey(c, 'keyup'); });
                    }
                }, { passive: false });
            });

            // Expose visibility control for C (via EM_JS)
            Module.setTouchControlsVisible = function(show) {
                overlay.style.display = show ? 'block' : 'none';
            };
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
