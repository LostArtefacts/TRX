<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRX - Tomb Raider Engine (WebGL)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #c8a040;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 10;
        }
        #loading h1 { font-size: 2em; margin-bottom: 0.5em; }
        #progress-bar {
            width: 320px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            margin: 1em auto;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: #c8a040;
            transition: width 0.2s;
        }
        #status { font-size: 0.9em; color: #888; margin-top: 0.5em; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>TRX</h1>
        <p>Tomb Raider Engine &mdash; WebGL Build</p>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="status">Initializing...</p>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script>
        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            setStatus: function(text) {
                var status = document.getElementById('status');
                if (status) status.textContent = text;
                // Parse progress from Emscripten status messages
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var pct = (parseFloat(m[2]) / parseFloat(m[4])) * 100;
                    var fill = document.getElementById('progress-fill');
                    if (fill) fill.style.width = pct + '%';
                }
                if (text === '') {
                    document.getElementById('loading').classList.add('hidden');
                }
            },
            onRuntimeInitialized: function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('canvas').focus();
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left
                    ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
                    : 'Starting...');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown - see JavaScript console');
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
